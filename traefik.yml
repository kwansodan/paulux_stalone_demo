# Traefik Static Configuration
# https://doc.traefik.io/traefik/

# API and Dashboard
api:
  dashboard: true
  insecure: false  # Dashboard only accessible internally

# Entry Points
entryPoints:
  web:
    address: ":80"
    # HTTP to HTTPS redirect
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Docker Provider
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false  # Only expose containers with traefik.enable=true
    network: polaris_network

# Certificate Resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      email: polarisbeautylounge@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Logging
log:
  level: INFO

# Access Logs
accessLog:
  filePath: /var/log/traefik/access.log
