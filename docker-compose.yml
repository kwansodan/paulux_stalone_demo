services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: paulux
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      # 5432 is often already taken on a shared host, hence 5433.
      # Bound to loopback on purpose: Docker's published ports bypass ufw, so
      # "0.0.0.0:5433" would put this database on the open internet regardless
      # of firewall rules. Reach it over an SSH tunnel instead (DATABASE_ACCESS.md):
      #   ssh -L 5433:127.0.0.1:5433 ubuntu@<host>
      # Set DB_BIND_HOST=0.0.0.0 to override, but understand what that exposes.
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paulux_network

  # Next.js Application
  app:
    # Deliberately NOT pinned to a fixed image tag. A hardcoded tag is shared
    # by every stack that declares it, so on a host running more than one, a
    # build here silently replaces the image another stack starts from. Without
    # `image:`, Compose derives the tag from the project name and collisions
    # become impossible.
    build:
      context: ./next_paulux
      dockerfile: Dockerfile.prod
      network: host
      args:
        # NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY is a runtime var only - see the note
        # in next_paulux/Dockerfile.prod. Set it under `environment:` below.
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_MINIO_ENDPOINT=${NEXT_PUBLIC_MINIO_ENDPOINT}
        - NEXT_PUBLIC_MINIO_PORT=${NEXT_PUBLIC_MINIO_PORT}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DB_USER=${DB_USER}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NODE_ENV=${NODE_ENV}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - NEXT_PUBLIC_MINIO_ENDPOINT=${NEXT_PUBLIC_MINIO_ENDPOINT}
      - NEXT_PUBLIC_MINIO_PORT=${NEXT_PUBLIC_MINIO_PORT}
      - GOOGLE_SERVICES_ACCOUNT_EMAIL=${GOOGLE_SERVICES_ACCOUNT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - BASE_URL=${BASE_URL}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_DEV=${INNGEST_DEV}
      - ARKESEL_API_KEY=${ARKESEL_API_KEY}
      - ARKESAL_BASE_URL=${ARKESAL_BASE_URL}
      - PRIMARY_PAYSTACK_SECRET_KEY=${PRIMARY_PAYSTACK_SECRET_KEY}
      - SECONDARY_PAYSTACK_SECRET_KEY=${SECONDARY_PAYSTACK_SECRET_KEY}
      # Demo is served over plain HTTP on a host port, so session cookies must
      # NOT be marked Secure - the browser would drop them and login would
      # silently bounce back to the login page. Set to "true" if this ever
      # gets put behind TLS.
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    ports:
      # Published directly: this stack has no edge proxy of its own (see the
      # `edge` profile below). Reach the app on this port, or point an existing
      # proxy at it.
      - "${APP_HOST_PORT:-3002}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - paulux_network
    volumes:
      - app_cache:/app/.next/cache

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9003}
    command: server /data --console-address ":9001"
    ports:
      # API - must be reachable by browsers, uploaded images are served from it
      - "${MINIO_HOST_PORT:-9007}:9000"
      # Console (admin UI)
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - paulux_network


  # Edge proxy + TLS. Disabled by default, because on a shared host something
  # else usually already owns 80/443 and holds the certificates - in which case
  # point that proxy at ${APP_HOST_PORT} rather than running this.
  # On a dedicated host, enable it with:
  #   docker compose --profile edge up -d
  # after pointing nginx/nginx.conf at a hostname you control and issuing certs
  # for it. The bundled config will not start without matching certificates.
  nginx:
    image: nginx:alpine
    profiles: [ "edge" ]
    restart: unless-stopped
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - paulux_network

  certbot:
    image: certbot/certbot
    profiles: [ "edge" ]
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;"

volumes:
  postgres_data:
  app_cache:
  minio_data:
  certbot_webroot:
  certbot_certs:

networks:
  paulux_network:
    driver: bridge
