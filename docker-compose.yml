services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: polaris
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      # Demo runs alongside production on the same host - do not reuse 5432.
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polaris_network

  # Next.js Application
  app:
    image: polaris-main:latest-polaris-main
    pull_policy: never
    build:
      context: ./next_polaris
      dockerfile: Dockerfile.prod
      network: host
      args:
        # NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY is a runtime var only - see the note
        # in next_polaris/Dockerfile.prod. Set it under `environment:` below.
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_MINIO_ENDPOINT=${NEXT_PUBLIC_MINIO_ENDPOINT}
        - NEXT_PUBLIC_MINIO_PORT=${NEXT_PUBLIC_MINIO_PORT}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DB_USER=${DB_USER}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NODE_ENV=${NODE_ENV}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - NEXT_PUBLIC_MINIO_ENDPOINT=${NEXT_PUBLIC_MINIO_ENDPOINT}
      - NEXT_PUBLIC_MINIO_PORT=${NEXT_PUBLIC_MINIO_PORT}
      - GOOGLE_SERVICES_ACCOUNT_EMAIL=${GOOGLE_SERVICES_ACCOUNT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - BASE_URL=${BASE_URL}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_DEV=${INNGEST_DEV}
      - ARKESEL_API_KEY=${ARKESEL_API_KEY}
      - ARKESAL_BASE_URL=${ARKESAL_BASE_URL}
      - PRIMARY_PAYSTACK_SECRET_KEY=${PRIMARY_PAYSTACK_SECRET_KEY}
      - SECONDARY_PAYSTACK_SECRET_KEY=${SECONDARY_PAYSTACK_SECRET_KEY}
      # Demo is served over plain HTTP on a host port, so session cookies must
      # NOT be marked Secure - the browser would drop them and login would
      # silently bounce back to the login page. Set to "true" if this ever
      # gets put behind TLS.
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    ports:
      # Published so the host's existing reverse proxy can route the demo
      # subdomain here (prod app = 3000, dev = 3001).
      - "${APP_HOST_PORT:-3002}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - polaris_network
    volumes:
      - app_cache:/app/.next/cache

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9003}
    command: server /data --console-address ":9001"
    ports:
      # API     (prod uses 9005, dev uses 9006)
      - "${MINIO_HOST_PORT:-9007}:9000"
      # Console (prod uses 9001, dev uses 9002)
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - polaris_network


  # Edge proxy + TLS. Disabled by default: on a host that already runs the
  # production stack, that nginx owns 80/443 and holds the Let's Encrypt certs,
  # and this service would have neither. Route the demo subdomain to
  # ${APP_HOST_PORT} on the existing proxy instead.
  # To run a self-contained demo on its own host:
  #   docker compose --profile edge up -d
  # (first point nginx.conf at a hostname you control and re-issue certs).
  nginx:
    image: nginx:alpine
    profiles: [ "edge" ]
    restart: unless-stopped
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - polaris_network

  certbot:
    image: certbot/certbot
    profiles: [ "edge" ]
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;"

volumes:
  postgres_data:
  app_cache:
  minio_data:
  certbot_webroot:
  certbot_certs:

networks:
  polaris_network:
    driver: bridge
